<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif"><rect width="1600" height="1000" fill="#2B1B3D"/>
