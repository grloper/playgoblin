<text x="190" y="92" font-size="46" font-weight="800" fill="#F5F3EE">What PlayGoblin caught</text>
<text x="190" y="130" font-size="24" fill="#F5F3EE" fill-opacity=".75">On a real Unreal Engine 5.8 game and a sample project with planted bugs</text><rect x="60" y="190" width="1480" height="132" rx="18" fill="#F5F3EE" fill-opacity=".07"/><rect x="60" y="190" width="10" height="132" rx="5" fill="#E5484D"/><rect x="100" y="212" width="150" height="34" rx="17" fill="#E5484D"/><text x="175.0" y="235" font-size="17" font-weight="800" fill="#F5F3EE" text-anchor="middle" letter-spacing="1">CRITICAL</text><rect x="264" y="212" width="170" height="34" rx="17" fill="none" stroke="#F5F3EE" stroke-opacity=".5" stroke-width="1.5"/><text x="349.0" y="235" font-size="17" font-weight="800" fill="#F5F3EE" text-anchor="middle" letter-spacing="1">REAL GAME</text><text x="100" y="278" font-size="34" font-weight="800" fill="#F5F3EE">The player never moved</text><text x="100" y="308" font-size="22" fill="#F5F3EE" fill-opacity=".78">No input was bound to move the pawn. The bot presses the game's own bound keys, so the missing binding showed up.</text><rect x="60" y="340" width="1480" height="132" rx="18" fill="#F5F3EE" fill-opacity=".07"/><rect x="60" y="340" width="10" height="132" rx="5" fill="#8E6BD0"/><rect x="100" y="362" width="200" height="34" rx="17" fill="#8E6BD0"/><text x="200.0" y="385" font-size="17" font-weight="800" fill="#F5F3EE" text-anchor="middle" letter-spacing="1">BOT BUG, FIXED</text><rect x="314" y="362" width="170" height="34" rx="17" fill="none" stroke="#F5F3EE" stroke-opacity=".5" stroke-width="1.5"/><text x="399.0" y="385" font-size="17" font-weight="800" fill="#F5F3EE" text-anchor="middle" letter-spacing="1">REAL GAME</text><text x="100" y="428" font-size="34" font-weight="800" fill="#F5F3EE">Level-sized invisible blocking volume</text><text x="100" y="458" font-size="22" fill="#F5F3EE" fill-opacity=".78">It hid the ground from every floor probe. The bot now skips actors it starts inside and logs them.</text><rect x="60" y="490" width="1480" height="132" rx="18" fill="#F5F3EE" fill-opacity=".07"/><rect x="60" y="490" width="10" height="132" rx="5" fill="#FFB020"/><rect x="100" y="512" width="120" height="34" rx="17" fill="#FFB020"/><text x="160.0" y="535" font-size="17" font-weight="800" fill="#2B1B3D" text-anchor="middle" letter-spacing="1">MEDIUM</text><rect x="234" y="512" width="170" height="34" rx="17" fill="none" stroke="#F5F3EE" stroke-opacity=".5" stroke-width="1.5"/><text x="319.0" y="535" font-size="17" font-weight="800" fill="#F5F3EE" text-anchor="middle" letter-spacing="1">REAL GAME</text><text x="100" y="578" font-size="34" font-weight="800" fill="#F5F3EE">Prototype look</text><text x="100" y="608" font-size="22" fill="#F5F3EE" fill-opacity=".78">Visible actors still on /Engine/BasicShapes meshes or the engine grid material.</text><rect x="60" y="640" width="1480" height="132" rx="18" fill="#F5F3EE" fill-opacity=".07"/><rect x="60" y="640" width="10" height="132" rx="5" fill="#FFB020"/><rect x="100" y="662" width="120" height="34" rx="17" fill="#FFB020"/><text x="160.0" y="685" font-size="17" font-weight="800" fill="#2B1B3D" text-anchor="middle" letter-spacing="1">MEDIUM</text><rect x="234" y="662" width="210" height="34" rx="17" fill="none" stroke="#F5F3EE" stroke-opacity=".5" stroke-width="1.5"/><text x="339.0" y="685" font-size="17" font-weight="800" fill="#F5F3EE" text-anchor="middle" letter-spacing="1">SAMPLE PROJECT</text><text x="100" y="728" font-size="34" font-weight="800" fill="#F5F3EE">Dead UMG button and “TODO: title”</text><text x="100" y="758" font-size="22" fill="#F5F3EE" fill-opacity=".78">An Options button that does nothing, and placeholder text on a menu (planted bugs).</text><rect x="60" y="790" width="1480" height="132" rx="18" fill="#F5F3EE" fill-opacity=".07"/><rect x="60" y="790" width="10" height="132" rx="5" fill="#3BB273"/><rect x="100" y="812" width="250" height="34" rx="17" fill="#3BB273"/><text x="225.0" y="835" font-size="17" font-weight="800" fill="#2B1B3D" text-anchor="middle" letter-spacing="1">FALSE POSITIVE, FIXED</text><rect x="364" y="812" width="170" height="34" rx="17" fill="none" stroke="#F5F3EE" stroke-opacity=".5" stroke-width="1.5"/><text x="449.0" y="835" font-size="17" font-weight="800" fill="#F5F3EE" text-anchor="middle" letter-spacing="1">REAL GAME</text><text x="100" y="878" font-size="34" font-weight="800" fill="#F5F3EE">Pastel pink flagged as missing-material pink</text><text x="100" y="908" font-size="22" fill="#F5F3EE" fill-opacity=".78">Only pure magenta counts as a missing material now.</text><text x="60" y="970" font-size="20" fill="#F5F3EE" fill-opacity=".6">Pre-release 0.1.0. Accuracy on real games is not measured yet; “no findings” never means bug free.</text></svg>